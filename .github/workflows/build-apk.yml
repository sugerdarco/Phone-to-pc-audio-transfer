name: Build installable Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Java 17 for Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install API 35 platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: AndroidSender
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK for installation
        uses: actions/upload-artifact@v4
        with:
          name: PhoneToPC-Android-APK
          path: AndroidSender/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
